name: CI

# PR 트리거 한정 — 모든 push에 CI를 돌리지 않아 분당 비용을 누적하지 않는다.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ruff 설치
        run: pip install ruff==0.5.7

      - name: ruff 검사 및 로그 저장
        run: |
          ruff check services/ > lint_log.txt 2>&1 || (echo "LINT_FAILED=true" >> $GITHUB_ENV && cat lint_log.txt && exit 1)

      - name: 지휘자 분석 (실패 시)
        if: failure() && env.LINT_FAILED == 'true'
        env:
          CONDUCTOR_API_URL: ${{ secrets.CONDUCTOR_API_URL }}
        run: |
          pip install requests
          python3 scripts/ci_guard.py --type lint --log lint_log.txt

  python-test:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install -r services/langchain_api/requirements.txt
          pip install pytest-asyncio httpx requests

      - name: 테스트 실행 및 로그 저장
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          pytest tests/ > test_log.txt 2>&1 || (echo "TEST_FAILED=true" >> $GITHUB_ENV && cat test_log.txt && exit 1)

      - name: 지휘자 분석 (실패 시)
        if: failure() && env.TEST_FAILED == 'true'
        env:
          CONDUCTOR_API_URL: ${{ secrets.CONDUCTOR_API_URL }}
        run: |
          python3 scripts/ci_guard.py --type test --log test_log.txt

  compose-validate:
    name: docker-compose 구문 검증
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config 검증
        run: docker compose -f docker-compose.yml config --quiet
