version: '3.8'

name: ai-devops-orchestrator

services:
  # =============================================================================
  # AI Analysis Engine (LangChain + FastAPI)
  # =============================================================================
  langchain-api:
    image: ai-devops-orchestrator/langchain-api:latest
    build:
      context: ./services/langchain_api
      dockerfile: Dockerfile
    container_name: ai-devops-langchain-api
    ports:
      - "${LANGCHAIN_API_PORT:-8000}:8000"
    environment:
      # AI Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4-turbo}
      - AI_CONFIDENCE_THRESHOLD=${AI_CONFIDENCE_THRESHOLD:-0.7}

      # Database connections
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - CHROMADB_COLLECTION_NAME=${CHROMADB_COLLECTION_NAME:-devops_knowledge}
      - REDIS_URL=redis://redis:6379/0

      # GitHub integration
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_ORG=${GITHUB_ORG}

      # Security
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5678}

      # Monitoring
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}

    volumes:
      - ./services/langchain_api:/app
      - langchain_logs:/app/logs
    depends_on:
      - chromadb
      - redis
    networks:
      - ai-devops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # Workflow Automation (n8n)
  # =============================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-devops-n8n
    profiles: ["legacy-demo"]
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Basic Authentication
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}

      # Webhook configuration
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/webhook}
      - N8N_PAYLOAD_SIZE_MAX=16
      - N8N_EXECUTION_TIMEOUT=${N8N_EXECUTION_TIMEOUT:-300}

      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_password

      # Generic timezone setting
      - GENERIC_TIMEZONE=UTC

      # Security
      - N8N_SECURE_COOKIE=false
      - N8N_DISABLE_UI=false

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
      - ./n8n-credentials:/credentials:ro
    depends_on:
      - postgres
      - langchain-api
    networks:
      - ai-devops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Vector Database (ChromaDB)
  # =============================================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: ai-devops-chromadb
    ports:
      - "${CHROMADB_PORT:-8001}:8000"
    environment:
      - CHROMA_HOST=0.0.0.0
      - CHROMA_PORT=8000
      - CHROMA_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - chromadb_data:${CHROMADB_PERSIST_DIRECTORY:-/chroma/chroma}
    networks:
      - ai-devops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Cache Layer (Redis)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: ai-devops-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - ai-devops-network

  # =============================================================================
  # Database (PostgreSQL for n8n)
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ai-devops-postgres
    profiles: ["legacy-demo"]
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_password
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-devops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ai-devops-network:
    name: ai-devops-network
    driver: bridge

volumes:
  langchain_logs:
    name: ai-devops-langchain-logs
  n8n_data:
    name: ai-devops-n8n-data
  chromadb_data:
    name: ai-devops-chromadb-data
  redis_data:
    name: ai-devops-redis-data
  postgres_data:
    name: ai-devops-postgres-data

  # Monitoring (optional)
  prometheus_data:
    name: ai-devops-prometheus-data
  grafana_data:
    name: ai-devops-grafana-data

  # Logging (optional)
  elasticsearch_data:
    name: ai-devops-elasticsearch-data
